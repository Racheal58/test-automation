    Product:
      title: Product
      type: object
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/schemas/Product'
        description: API reference for the Product schema
      required:
        - id
        - sku
        - name
        - slug
        - short_description
        - product_type
        - active
        - stock_available
        - on_subscription
        - on_promotion
        - has_variant
        - tags
        - category_ids
        - categories
        - reviews_rating_sum
        - reviews_count
        - attributes
        - pricing
        - variant_options
        - promotion
        - images
        - subscription
        - variants
        - bundle_items
      properties:
        id:
          description: The ID of the product
          type: string
        sku:
          type:
            - string
            - 'null'
        name:
          type: string
        slug:
          type: string
        short_description:
          type:
            - string
            - 'null'
        product_type:
          type: string
          enum:
            - physical
            - digital
            - bundle
          examples:
            - physical
        active:
          type: boolean
          readOnly: true
        stock_available:
          description: Indicates whether the product has stock available
          type: boolean
          readOnly: true
        backorder:
          description: >-
            Indicates whether the item is being fulfilled as a backorder. When
            true, the item is not currently in stock and will ship later once
            inventory is available. This may result in the order being split
            into multiple shipments, with delays for the backordered portion.
          type: boolean
        on_subscription:
          description: Indicates whether the product has any subscription plans avaialble
          type: boolean
          readOnly: true
        on_promotion:
          description: >-
            Indicates whether the product is currently on promotion. When true,
            the `ProductPromotion` object will contain details of the promotion
          type: boolean
          readOnly: true
        has_variant:
          description: Indicates whether the product has variants
          type: boolean
          readOnly: true
        tags:
          type:
            - array
            - 'null'
          items:
            type: string
        category_ids:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        reviews_rating_sum:
          type: number
          format: double
        reviews_count:
          type: integer
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        pricing:
          $ref: '#/components/schemas/ProductPricing'
        variant_options:
          description: >-
            this will be used if has_variant is true, to auto set default
            values.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/VariantOption'
        promotion:
          $ref: '#/components/schemas/ProductPromotion'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        subscription:
          type: array
          items:
            $ref: '#/components/schemas/ProductSubscription'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        bundle_items:
          $ref: '#/components/schemas/ProductBundleItem'
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/LotBatchDetail'
      examples: []
    ProductAttribute:
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/schemas/ProductAttribute'
        description: API reference for the ProductAttribute schema
      discriminator:
        propertyName: type
        mapping:
          color: '#/components/schemas/ColorAttribute'
          single-select: '#/components/schemas/SingleSelectAttribute'
          multi-select: '#/components/schemas/MultiSelectAttribute'
          text: '#/components/schemas/TextAttribute'
          date: '#/components/schemas/DateAttribute'
          number: '#/components/schemas/NumberAttribute'
          boolean: '#/components/schemas/BooleanAttribute'
      oneOf:
        - $ref: '#/components/schemas/ColorAttribute'
          type: object
        - $ref: '#/components/schemas/SingleSelectAttribute'
          type: object
        - $ref: '#/components/schemas/MultiSelectAttribute'
          type: object
        - $ref: '#/components/schemas/TextAttribute'
          type: object
        - $ref: '#/components/schemas/DateAttribute'
          type: object
        - $ref: '#/components/schemas/NumberAttribute'
          type: object
        - $ref: '#/components/schemas/BooleanAttribute'
          type: object
    ProductBundleItem:
