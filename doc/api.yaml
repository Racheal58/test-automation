            When option_type is color, value will contain an array of objects
            like:

            ```json

            [
                {
                "name": "first_color",
                "hexcode": "#000000"
                },
                {
                "name": "second_color",
                "hexcode": "#FFFFFF"
                }
            ]

            ```
          type: array
          items:
            oneOf:
              - type: string
              - type: object
    VolumeBasedCouponPromotion:
      title: VolumeBasedCouponPromotion
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/schemas/VolumeBasedCouponPromotion
        description: API reference for the VolumeBasedCouponPromotion schema
      allOf:
        - $ref: '#/components/schemas/CouponPromotionCommonDetail'
        - type: object
          required:
            - details
            - applies_to_product
          properties:
            details:
              $ref: '#/components/schemas/VolumeBasedRule'
            applies_to_product:
              enum:
                - product
    VolumeBasedPromotion:
      title: VolumeBasedPromotion
      type: object
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/schemas/VolumeBasedPromotion
        description: API reference for the VolumeBasedPromotion schema
      required:
        - promotion_type
        - slabs
      properties:
        promotion_type:
          type: string
          enum:
            - discount
            - volume-based
            - fixed-price
            - free-goods
          const: volume-based
          readOnly: true
        slabs:
          type: array
          items:
            type: object
            properties:
              quantity_limit:
                description: The minimum quantity required to qualify for the discount.
                type: integer
              discount_percent:
                description: >-
                  The percentage discount applied when the quantity limit is
                  reached.
                type: number
                readOnly: true
            required:
              - quantity_limit
              - discount_percent
    VolumeBasedRule:
      title: VolumeBasedRule
      type: object
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/schemas/VolumeBasedRule'
        description: API reference for the VolumeBasedRule schema
      required:
        - products
        - maximum_discount_amount
      properties:
        products:
          type: array
          items:
            type: object
            required:
              - product_id
              - variant_id
              - slabs
            properties:
              product_id:
                type:
                  - string
                  - 'null'
              variant_id:
                type:
                  - string
                  - 'null'
              slabs:
                type: array
                items:
                  type: object
                  required:
                    - quantity
                    - condition
                    - discount_percent
                  properties:
                    quantity:
                      type: integer
                    condition:
                      enum:
                        - less-or-equal
                        - greater
                    discount_percent:
                      type: number
        maximum_discount_amount:
          type:
            - number
            - 'null'
    WalletPayment:
      title: WalletPayment
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/schemas/WalletPayment'
        description: API reference for the WalletPayment schema
      allOf:
        - $ref: '#/components/schemas/PaymentInfo'
        - type: object
          properties:
            wallet_name:
              type: string
  parameters:
    CustomerGroupId:
      name: x-customer-group-id
      in: header
      required: false
      schema:
        type: string
      description: >-
        This param is used to determine product pricing, promotions, and
        subscription rates.  If a valid customer group id is provided, pricing
        details will be retrieved accordingly.  If no matching data is found for
        the specified customer group id, the system will fall back to the
        default customer group id.  If no data is found for the default group
        either, the highest applicable price will be returned.
    DebugMode:
      name: x-debug-mode
      in: header
      required: false
      schema:
        type: boolean
      description: >-
        This param is used to enable debug mode. If debug mode is enabled, the
        API will return OTP as well. This is only for development and testing
        purposes.
    pageLimitParam:
      name: limit
      in: query
      description: no of rows per page
      required: false
      schema:
        type: integer
        minimum: 1
    pageParam:
      name: page
      in: query
      description: page number of pagination list
      required: false
      schema:
        type: number
        minimum: 1
    searchKeyword:
      name: search
      in: query
      description: search keyword
      required: false
      schema:
        type: string
    sortingParam:
      name: sort_by
      in: query
      description: 'JSON string format: {"field1":"asc", "field2":"desc"}'
      required: false
      schema:
        description: >-
          json string in format {'field_name':'asc', 'other_field_name':'desc',
          ...}
        type: string
        examples:
          - '{"country":"asc","city":"asc","population":"desc"}'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - success
              - code
            properties:
              message:
                type: string
                x-speakeasy-error-message: true
              success:
                type: boolean
              code:
                type: string
              error:
                type: object
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - success
              - code
            properties:
              message:
                type: string
                x-speakeasy-error-message: true
              success:
                type: boolean
              code:
                type: string
    Unauthorized:
      description: Not authorized for given operation on the Resource
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - success
              - code
            properties:
              message:
                type: string
                examples:
                  - Not authorized for given operation on the Resource.
                x-speakeasy-error-message: true
              success:
                type: boolean
                default: false
              code:
                type: string
                examples:
                  - unauthorized
    WebhookAccepted:
      description: Payload accepted
    WebhookGone:
      description: Endpoint permanently removed
    WebhookServerError:
      description: Temporary server error — we will retry
  securitySchemes:
    Authorization:
      type: http
      description: Access token
      scheme: bearer
    X-Api-Key:
      type: apiKey
      description: API key for your store
      name: X-Api-Key
      in: header
