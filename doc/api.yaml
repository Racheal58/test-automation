components:
  schemas:
    AcceleratedRewardCouponPromotion:
      title: AcceleratedRewardCouponPromotion
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/schemas/AcceleratedRewardCouponPromotion
        description: API reference for the AcceleratedRewardCouponPromotion schema
      allOf:
        - $ref: '#/components/schemas/CouponPromotionCommonDetail'
        - type: object
          required:
            - details
            - applies_to_product
          properties:
            details:
              $ref: '#/components/schemas/AcceleratedRewardRule'
            applies_to_product:
              enum:
                - product
                - category
    AcceleratedRewardRule:
      title: AcceleratedRewardRule
      type: object
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/schemas/AcceleratedRewardRule
        description: API reference for the AcceleratedRewardRule schema
      required:
        - products
        - category_id
        - bonus_loyalty_point
      properties:
        products:
          type: array
          items:
            type: object
            required:
              - product_id
              - variant_id
              - minimum_quantity
              - minimum_value
            properties:
              product_id:
                type:
                  - string
                  - 'null'
              variant_id:
                type:
                  - string
                  - 'null'
              minimum_quantity:
                type:
                  - integer
                  - 'null'
              minimum_value:
                type:
                  - number
                  - 'null'
        category_id:
          description: Array of category ids.
          type: array
          items:
            type: string
        bonus_loyalty_point:
          type: integer
    AdditionalProductDetails:
      title: AdditionalProductDetails
      type: object
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/schemas/AdditionalProductDetails
        description: API reference for the AdditionalProductDetails schema
      required:
        - description
        - hsn_code
        - videos
        - shipping
        - upselling_product_ids
        - crossselling_product_ids
        - seo
        - metadata
      properties:
        description:
          type:
            - string
            - 'null'
        hsn_code:
          type:
            - string
            - 'null'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/ProductVideo'
        shipping:
          $ref: '#/components/schemas/ProductShipping'
        upselling_product_ids:
          description: An array of product IDs
          type: array
          items:
            type:
              - string
              - 'null'
            pattern: '^[a-zA-Z0-9]{26}$'
            examples:
              - 01F3Z7KG06J4ACWH1C4926KJEB
        crossselling_product_ids:
          description: An array of product IDs
          type: array
          items:
            type: string
            pattern: '^[A-Za-z0-9]{26}$'
            examples:
              - 01F3Z7KG06J4ACWH1C4926KJEB
        seo:
          $ref: '#/components/schemas/Seo'
        metadata:
          type:
            - object
            - 'null'
          additionalProperties:
            type: string
    AnalyticsEvent:
      title: AnalyticsEvent
      description: Model for analytics event
      type: object
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/schemas/AnalyticsEvent'
        description: API reference for the AnalyticsEvent schema
      required:
        - event
        - type
        - userId
        - channel
        - context
        - properties
        - messageId
        - timestamp
        - sentAt
      properties:
        event:
