        - name: vpa
          in: query
          description: >-
            The Virtual Payment Address or VPA is a unique ID given to an
            individual using the Unified Payment Interface (UPI) service.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                  content:
                    properties:
                      vpa:
                        type: string
                      status:
                        type: string
                    type: object
