openapi: 3.1.0
info:
  version: '1.0'
  title: CE Storefront APIs
  summary: Customer-facing e-commerce API for building exceptional shopping experiences
  description: >-
    Public-facing API for Commerce Engine storefronts, enabling seamless
    shopping experiences with product browsing, cart management, checkout
    processing, user accounts, and order tracking. Perfect for building web,
    mobile, and headless commerce applications.
  contact:
    name: Support
    email: support@commercengine.io
    url: 'https://www.commercengine.io/contact-us'
  license:
    url: 'https://www.commercengine.io/contact-us'
    name: All Rights Reserved
externalDocs:
  url: 'https://llm-docs.commercengine.io'
  description: Commerce Engine API Reference Documentation
servers:
  - url: 'https://staging.api.commercengine.io/api/v1/{store_id}/storefront'
    description: Staging Server
    variables:
      store_id:
        description: Store ID
        default: store_id
    x-speakeasy-server-id: staging
  - url: 'https://prod.api.commercengine.io/api/v1/{store_id}/storefront'
    description: Prod Server
    variables:
      store_id:
        description: Store ID
        default: store_id
    x-speakeasy-server-id: prod
tags:
  - name: Analytics
    description: Analytics
  - name: Auth
    description: auth
  - name: Campaigns
    description: Campaigns
  - name: Carts
    description: Carts
  - name: Catalog
    description: Catalog
  - name: Common
    description: Common
  - name: Coupons & promotions
    description: Coupons & promotions
  - name: Customers
    description: Customers
  - name: Juspay
    description: Juspay Payments
  - name: KYC
    description: KYC
  - name: Orders
    description: Orders
  - name: Others
    description: Others
  - name: Payments
    description: Payments
  - name: PayU
    description: PayU Payments
  - name: POS
    description: POS
  - name: Shipping
    description: Shipping
  - name: Store
    description: Store
  - name: Subscriptions
    description: Subscriptions
paths:
  /analytics/track:
    post:
      tags:
        - Analytics
      operationId: track-analytics-event
      summary: Track event
      description: Track event
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/track-analytics-event
        description: API reference for the track-analytics-event operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEvent'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - Authorization: []
      x-speakeasy-group: analytics
      x-speakeasy-ignore: true
      x-speakeasy-name-override: trackAnalyticsEvent
  /auth/anonymous:
    post:
      tags:
        - Auth
      operationId: get-anonymous-token
      summary: Anonymous user
      description: >-
        This API’s focus is on anonymous users who have not undergone the formal
        account creation process. These anonymous users are associated with a
        unique ID, ensuring that even in the absence of a fully realized
        account, there is a distinct and trackable identity for each user. 

        To interact with the system, each anonymous user is issued an access
        token. This access token plays a dual role in the system: it serves as a
        means of authenticating the user and it also acts as a tool for
        authorization, determining what actions the authenticated user is
        permitted to perform.
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/get-anonymous-token
        description: API reference for the get-anonymous-token operation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A string containing a descriptive message related to the
                      success or failure of the anonymous user creation or
                      authentication.
                    type: string
                  success:
                    description: >-
                      A boolean value indicates the success or failure of the
                      anonymous user operation.`true` for success `false` for
                      failure.
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      user:
                        description: >-
                          Information about the user, including their name,
                          email, profile image, etc.
                        $ref: '#/components/schemas/AnonymousUser'
                      access_token:
                        description: >-
                          It is a string-based token utilized for authentication
                          and authorization.
                        type: string
                      refresh_token:
                        description: >-
                          It is a string-based token designed for refreshing the
                          user's access token. 
                        type: string
                    required:
                      - user
                      - access_token
                      - refresh_token
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - X-Api-Key: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: false
      x-speakeasy-name-override: getAnonymousToken
  /auth/change-password:
    post:
      tags:
        - Auth
      operationId: change-password
      summary: Change password
      description: >-
        The Change Password API is a key feature designed to provide a secure
        and standardized method for users to update their passwords.
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/change-password
        description: API reference for the change-password operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
                - confirm_password
              properties:
                old_password:
                  description: >-
                    The old password associated with the user's account. This
                    parameter is crucial for verifying the user's identity
                    before allowing a password change.
                  type: string
                new_password:
                  description: >-
                    The new password that the user intends to set for their
                    account. This parameter is necessary for updating the
                    password to enhance account security.
                  type: string
                confirm_password:
                  description: A confirmation of the new password.
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the change password operation.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      access_token:
                        description: >-
                          It is a string-based token utilized for authentication
                          and authorization.
                        type: string
                      refresh_token:
                        description: >-
                          It is a string-based token designed for refreshing the
                          user's access token.
                        type: string
                    required:
                      - access_token
                      - refresh_token
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: true
      x-speakeasy-name-override: changePassword
  /auth/forgot-password:
    post:
      tags:
        - Auth
      operationId: forgot-password
      summary: Forgot password
      description: >-
        The Forgot Password API provides a secure mechanism for users to
        initiate the password recovery process. This API provides one-time
        password (OTP) token, which facilitas the resetting of user’s account
        password.
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/forgot-password
        description: API reference for the forgot-password operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - phone
                - country_code
              properties:
                email:
                  description: A string representing the email address.
                  type: string
                phone:
                  description: 10 digit phone number without country code.
                  type: string
                country_code:
                  description: >-
                    Two-letter code begin with a plus sign prefix that
                    identifies different countries. By default it will be +91 if
                    not provided.

                    Use this key along with phone. Not necessary for email.
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the operation.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      otp_token:
                        description: >-
                          A string representing the OTP token which facilitas
                          the resetting of user’s account password.
                        type: string
                    required:
                      - otp_token
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: true
      x-speakeasy-name-override: forgotPassword
  /auth/generate-otp:
    post:
      tags:
        - Auth
      operationId: generate-otp
      summary: Generate OTP
      description: >-
        Generating a One-Time Password (OTP) typically involves creating a
        random code that is sent to a user for authentication or verification
        purposes.
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/operations/generate-otp'
        description: API reference for the generate-otp operation
      parameters:
        - $ref: '#/components/parameters/DebugMode'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GenerateOtpWithPhone'
                - $ref: '#/components/schemas/GenerateOtpWithEmail'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the operation.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      otp_token:
                        description: A string representing the OTP token.
                        type: string
                      otp_action:
                        description: >-
                          This is used for verifying OTP or using subsequent
                          APIs call.
                        type: string
                    required:
                      - otp_token
                      - otp_action
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: false
      x-speakeasy-name-override: generateOtp
  /auth/login/email:
    post:
      tags:
        - Auth
      operationId: login-with-email
      summary: Login with email
      description: >-
        This API enables users to authenticate into the system using their email
        address. It provides a secure way for users to Login by verifying their
        identity through a one-time password (OTP) sent to their email address.
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/login-with-email
        description: API reference for the login-with-email operation
      parameters:
        - $ref: '#/components/parameters/DebugMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  description: User's email address.
                  type: string
                  format: email
                register_if_not_exists:
                  description: >-
                    This is used to send OTP to unregistered phone. By default
                    it sends OTP to registered phone only. 

                    To send OTP to unregistered phone it should be pass with
                    true value like this,

                    "register_if_not_exists": true
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the Login process.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      otp_token:
                        description: >-
                          The otp token is a unique code that is used for
                          authentication during the Login process.
                        type: string
                      otp_action:
                        description: >-
                          It is used for verifying OTP and using subsequent API
                          call.
                        type: string
                    required:
                      - otp_token
                      - otp_action
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: false
      x-speakeasy-name-override: loginWithEmail
  /auth/login/password:
    post:
      tags:
        - Auth
      operationId: login-with-password
      summary: Login with password
      description: >-
        This API endpoint allows users to Login using their password. It
        requires the following parameters: email/phone and password. Also allows
        users to securely Login and obtain access and refresh tokens for
        subsequent API calls.
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/login-with-password
        description: API reference for the login-with-password operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required:
                    - phone
                    - password
                  title: phone
                  properties:
                    phone:
                      description: User's phone number.
                      type: string
                    country_code:
                      description: >-
                        Two-letter code begin with a plus sign prefix that
                        identifies different countries. By default it will be
                        +91 if not provided.

                        Use this key along with phone. Not necessary for email.
                      type: string
                      default: '+91'
                    password:
                      description: The password associated with the user's account.
                      type: string
                - required:
                    - email
                    - password
                  title: email
                  properties:
                    email:
                      type: string
                    password:
                      type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the Login process.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      user:
                        description: >-
                          Information about the user, including their name,
                          email, profile image, etc.
                        $ref: '#/components/schemas/User'
                      access_token:
                        description: >-
                          It is a string-based token utilized for authentication
                          and authorization.
                        type: string
                      refresh_token:
                        description: >-
                          It is a string-based token designed for refreshing the
                          user's access token.
                        type: string
                    required:
                      - user
                      - access_token
                      - refresh_token
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: true
      x-speakeasy-name-override: loginWithPassword
  /auth/login/phone:
    post:
      tags:
        - Auth
      operationId: login-with-phone
      summary: Login with phone
      description: >-
        This API enables users to authenticate into the system using their phone
        number. It provides a secure way for users to log in by verifying their
        identity through a one-time password (OTP) sent to their registered
        phone.
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/login-with-phone
        description: API reference for the login-with-phone operation
      parameters:
        - $ref: '#/components/parameters/DebugMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                country_code:
                  description: >-
                    Two-letter code begin with a plus sign prefix that
                    identifies different countries. By default it will be +91 if
                    not provided.
                  type: string
                  default: '+91'
                  const: '+91'
                phone:
                  description: 10 digit phone number without country code.
                  type: string
                register_if_not_exists:
                  description: >-
                    This is used to send OTP to unregistered phone. By default
                    it sends OTP to registered phone only. 

                    To send OTP to unregistered phone it should be pass with
                    true value like this,

                    "register_if_not_exists": true
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the Login process.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      otp_token:
                        description: >-
                          The otp token is a unique code that is used for
                          authentication during the Login/Register process.
                        type: string
                      otp_action:
                        description: >-
                          It is used for verifying OTP and using subsequent API
                          call.
                        type: string
                    required:
                      - otp_token
                      - otp_action
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: false
      x-speakeasy-name-override: loginWithPhone
  /auth/login/whatsapp:
    post:
      tags:
        - Auth
      operationId: login-with-whatsapp
      summary: Login with whatsapp
      description: >-
        This API enables users to authenticate into the system using their
        WhatsApp Number. It provides a secure way for users to Login by
        verifying their identity through a one-time password (OTP) sent to their
        WhatsApp Number.
      externalDocs:
        url: >-
          https://llm-docs.commercengine.io/storefront/operations/login-with-whatsapp
        description: API reference for the login-with-whatsapp operation
      parameters:
        - $ref: '#/components/parameters/DebugMode'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                country_code:
                  description: >-
                    Two-letter code begin with a plus sign prefix that
                    identifies different countries. By default it will be +91 if
                    not provided.
                  const: '+91'
                phone:
                  description: >-
                    10 digit phone number without country code linked with
                    WhatsApp.
                  type: string
                register_if_not_exists:
                  description: >-
                    This is used to send OTP to unregistered phone. By default
                    it sends OTP to registered phone only. 

                    To send OTP to unregistered phone it should be pass with
                    true value like this,

                    "register_if_not_exists": true
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the Login process.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      otp_token:
                        description: >-
                          The otp token is a unique code that is used for
                          authentication during the Login process.
                        type: string
                      otp_action:
                        description: >-
                          It is used for verifying OTP and using subsequent API
                          call.
                        type: string
                    required:
                      - otp_token
                      - otp_action
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: false
      x-speakeasy-name-override: loginWithWhatsapp
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Logout user
      description: >-
        The Logout User API initiate the logout process for a user. Upon a
        successful request, the API responds with a confirmation message. If the
        user is not found or there's an issue with the request, an error
        response is returned with an appropriate message.
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/operations/logout'
        description: API reference for the logout operation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the operation.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      access_token:
                        description: >-
                          It is a string-based token utilized for authentication
                          and authorization.
                        type: string
                      refresh_token:
                        description: >-
                          It is a string-based token designed for refreshing the
                          user's access token.
                        type: string
                      user:
                        description: An object representing user details.
                        $ref: '#/components/schemas/User'
                    required:
                      - access_token
                      - refresh_token
                      - user
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: false
      x-speakeasy-name-override: logout
  /auth/refresh-token:
    post:
      tags:
        - Auth
      operationId: refresh-token
      summary: Refresh access token
      description: >-
        The Refresh Access Token API is an integral component designed to
        enhance security and user experience. It enables clients to refresh
        their access tokens seamlessly, extending user sessions without
        compromising security.
      externalDocs:
        url: 'https://llm-docs.commercengine.io/storefront/operations/refresh-token'
        description: API reference for the refresh-token operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  description: A string representing the refresh token.
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - success
                  - content
                properties:
                  message:
                    description: >-
                      A descriptive message confirming the success or failure of
                      the operation.
                    type: string
                  success:
                    description: >-
                      Indicates whether the request was successful or failure
                      (true for success, false for failure).
                    type: boolean
                  content:
                    description: An object containing the response content.
                    properties:
                      access_token:
                        description: >-
                          It is a string-based token utilized for authentication
                          and authorization.
                        type: string
                      refresh_token:
                        description: >-
                          It is a string-based token designed for refreshing the
                          user's access token.
                        type: string
                    required:
                      - access_token
                      - refresh_token
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - Authorization: []
      x-speakeasy-group: auth
      x-speakeasy-ignore: false
      x-speakeasy-name-override: refreshToken
  /auth/register/email:
    post:
      tags:
        - Auth
      operationId: register-with-email
      summary: Register with email
