        - free_quantity
        - promotion_discount_amount
        - coupon_discount_amount
        - price_including_tax
        - listing_price
        - selling_price
        - selling_price_excluding_tax
        - min_order_quantity
        - max_order_quantity
        - incremental_quantity
        - handling_charge_excluding_tax
        - handling_charge_tax_rate
        - handling_charge_including_tax
        - tax_type
